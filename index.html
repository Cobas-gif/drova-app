<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body { font-family: sans-serif; padding: 10px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
      .card { border: 1px solid var(--tg-theme-button-color, #ccc); padding: 15px; margin: 10px 0; border-radius: 8px; }
      .price { font-weight: bold; color: var(--tg-theme-button-color, #007bff); }
      button { background: var(--tg-theme-button-color, #007bff); color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>🪵 Каталог дров</h2>
    <div id="catalog"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();

      // 1. Читаем sellers.json (он должен лежать рядом с index.html на GitHub)
      fetch('./sellers.json')
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('catalog');
          if (!data || data.length === 0) {
            container.innerHTML = '<p>Пока нет продавцов. Зайдите позже!</p>';
            return;
          }

          data.forEach(seller => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
              <h3>${seller.name}</h3>
              <p>📍 ${seller.town} | 🚚 ${seller.car}</p>
              <p>🌲 ${seller.breed} | ${seller.vol} м³</p>
              <p class="price">💰 ${seller.price} ₽ за машину</p>
              <button onclick="sendOrder(${JSON.stringify(JSON.stringify(seller))})">Заказать машину</button>
            `;
            container.appendChild(div);
          });
        })
        .catch(err => console.error(err));

      function sendOrder(sellerJson) {
        const seller = JSON.parse(sellerJson);
        const delivery = prompt("Куда доставить дрова? (город, адрес)");
        const phone = prompt("Ваш номер телефона (только цифры, например 79991234567)");

        if (!delivery || !phone) return;

        // 2. Отправляем данные в Telegram-бота
        tg.sendData(JSON.stringify({
          action: "order",
          seller_id: seller.id,
          delivery: delivery,
          phone: phone
        }));
      }
    </script>
  </body>
</html>
