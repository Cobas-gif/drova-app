<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обменник Дров — Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ec; color: #2b2b2b;
    margin: 0; padding: 16px; max-width: 480px; margin: 0 auto;
  }
  h1 { font-size: 22px; text-align: center; }
  h2 { font-size: 18px; }
  .card {
    background: #fff; border-radius: 12px; padding: 14px;
    margin: 12px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .card img { width: 100%; border-radius: 8px; }
  .price { font-size: 18px; font-weight: bold; color: #b3541e; }
  .muted { color: #777; font-size: 14px; }
  button {
    background: #2f6f3e; color: #fff; border: none; border-radius: 10px;
    padding: 12px 18px; font-size: 16px; width: 100%; margin-top: 10px;
  }
  .btn-back { background: #888; }
  input {
    width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px;
    border: 1px solid #ccc; box-sizing: border-box; font-size: 15px;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="screen-catalog">
  <h1>🪵 Обменник Дров</h1>
  <p class="muted">Выбирай машину дров — закажи доставкой к дому.</p>
  <div id="catalog-list"></div>
</div>

<div id="screen-card" class="hidden">
  <button class="btn-back" onclick="showCatalog()">← Назад к каталогу</button>
  <div class="card" id="card-body"></div>
</div>

<div id="screen-order" class="hidden">
  <button class="btn-back" onclick="showCard()">← Назад</button>
  <div class="card">
    <h2>🚛 Оформление заказа</h2>
    <p id="order-seller" class="muted"></p>
    <label>Куда доставить дрова (село / город):</label>
    <input type="text" id="form-delivery" placeholder="Например: Турунтаево">
    <label>Ваш телефон (для связи продавца):</label>
    <input type="tel" id="form-phone" placeholder="Например: 89021234567">
    <button onclick="submitOrder()">✅ Отправить заказ</button>
    <p class="muted">Передумали? Просто нажмите «← Назад».</p>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const FALLBACK = [
    {id: "demo1", name: "ИП Иванов", town: "Улан-Удэ", car: "ГАЗ-53", vol: 6,
     breed: "Сосна", price: 12000},
    {id: "demo2", name: "Частный мастер", town: "Турунтаево", car: "ЗИЛ-130", vol: 5,
     breed: "Берёза", price: 9000},
    {id: "demo3", name: "Лесопилка «Тайга»", town: "Иволгинск", car: "КамАЗ", vol: 10,
     breed: "Смешанный", price: 15000}
  ];

  let SELLERS = [];
  let currentSeller = null;

  async function loadCatalog() {
    try {
      const r = await fetch("sellers.json");
      const data = await r.json();
      if (Array.isArray(data) && data.length > 0) SELLERS = data;
      else SELLERS = FALLBACK;
    } catch (e) {
      SELLERS = FALLBACK;
    }
    renderCatalog();
  }

  function fmt(x) {
    return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function renderCatalog() {
    const box = document.getElementById("catalog-list");
    box.innerHTML = "";
    SELLERS.forEach((s, i) => {
      const d = document.createElement("div");
      d.className = "card";
      d.innerHTML =
        "<b>" + (s.name || "Продавец") + "</b><br>" +
        "🚚 " + (s.car || "—") + " — " + fmt(s.vol || 0) + " м³<br>" +
        "🌲 " + (s.breed || "—") + "<br>" +
        "📍 " + (s.town || "—") + "<br>" +
        "<span class='price'>" + fmt(s.price || 0) + " ₽ за полную машину</span><br>";
      const btn = document.createElement("button");
      btn.textContent = "Открыть";
      btn.onclick = () => openCard(i);
      d.appendChild(btn);
      box.appendChild(d);
    });
  }

  function show(id) {
    ["screen-catalog", "screen-card", "screen-order"].forEach(x =>
      document.getElementById(x).classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function showCatalog() { show("screen-catalog"); }

  function openCard(i) {
    currentSeller = SELLERS[i];
    const body = document.getElementById("card-body");
    let html = "";
    if (currentSeller.photo) {
      html += "<img src='" + currentSeller.photo + "' alt='Фото дров'>";
    }
    html +=
      "<h2>" + (currentSeller.name || "Продавец") + "</h2>" +
      "🚚 Машина: " + (currentSeller.car || "—") + "<br>" +
      "📦 Объём: " + fmt(currentSeller.vol || 0) + " м³<br>" +
      "🌲 Порода: " + (currentSeller.breed || "—") + "<br>" +
      "📍 Откуда: " + (currentSeller.town || "—") + "<br>" +
      "<span class='price'>💰 " + fmt(currentSeller.price || 0) +
      " ₽ за полную машину</span>";
    body.innerHTML = html;
    show("screen-card");
  }

  function showCard() { show("screen-card"); }

  function openOrder() {
    if (!currentSeller) return;
    document.getElementById("order-seller").textContent =
      "Заказ у: " + currentSeller.name + " (" + fmt(currentSeller.price) + " ₽)";
    show("screen-order");
  }

  function submitOrder() {
    const phone = document.getElementById("form-phone").value.trim();
    const delivery = document.getElementById("form-delivery").value.trim();

    if (phone.replace(/\D/g, "").length < 10) {
      alert("Введите телефон минимум из 10 цифр");
      return;
    }
    if (delivery.length < 2) {
      alert("Укажите населённый пункт доставки");
      return;
    }

    tg.sendData(JSON.stringify({
      action: "order",
      seller_id: currentSeller.id,
      phone: phone,
      delivery: delivery
    }));
  }

  loadCatalog();
</script>

</body>
</html>
